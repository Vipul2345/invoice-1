name: Build InvoiceFlow Windows Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Desktop Installer & Portable (.exe)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Desktop Executables (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceFlow-Windows-Desktop-Apps
          path: |
            dist_electron/*.exe
          if-no-files-found: error
          retention-days: 14
